<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WeatherSnap</title>
        <link rel="stylesheet" href="weather-snap.css">
    </head>
    <body>
        <div class="weather-shell">
            <div class="brand">
                <h1>WeatherSnap</h1>
                <div class="brand-mark">☁️</div>
            </div>

            <form>
                <input type="text" class="weather-input" placeholder="Search city...">
                <button type="submit" class="search-weather">Check Weather</button>
            </form>
            <p class="errorMessage"></p>
            <p class="serverMessage"></p>
            <p class="loading"></p>

            <section>
                <div class="container">
                    <div class="weather-card">
                        <div class="weather-top">
                            <p class="searched-city">City</p>
                            <div id="emoji">☀️</div>
                        </div>
                        <p class="temperature">--°C</p>
                        <p class="code">Weather condition</p>
                        <p class="humidity"><span class="mini-pill">Humidity</span> --%</p>
                        <p class="wind"><span class="mini-pill">Wind</span> -- km/h</p>
                    </div>
                </div>
            </section>
        </div>

        <script src="weather-snap.js"></script>

    </body>
</html>
